<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#660099">
<title>Pulso | Quadro de trabalho Vivo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script type="module" src="board.js"></script>
</head>
<body>
<section id="login-panel" class="login-panel">
  <form id="login-form">
    <h1>Entrar no Pulso</h1>
    <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
    <button id="login-submit" class="primary" type="submit" disabled>Entrar</button>
    <p id="login-status" aria-live="polite">Conectando…</p>
  </form>
</section>
<div id="app" hidden>
<header class="top">
  <div class="brand"><span class="logo"><img src="vivinho.svg" width="25" height="34" alt="Vivinho"></span><div><span class="workspace">Pulso · Quadro de trabalho</span><h1 id="board-title">Quadro de projetos</h1></div><button type="button" id="rename-board" aria-label="Renomear quadro" title="Renomear quadro">✎</button></div>
  <div class="account-actions"><button id="new">＋ Novo cartão</button><button id="logout" type="button">Sair</button></div>
</header>
<main>
  <div class="toolbar"><div id="stats" role="group" aria-label="Filtros rápidos de prazo">
    <button type="button" class="summary" data-deadline="" aria-pressed="true">Todos <span></span></button>
    <button type="button" class="summary late" data-deadline="late" aria-pressed="false">Atrasados <span></span></button>
    <button type="button" class="summary today" data-deadline="today" aria-pressed="false">Hoje <span></span></button>
    <button type="button" class="summary" data-deadline="future" aria-pressed="false">Futuros <span></span></button>
  </div><div class="filters"><input id="search" type="search" placeholder="Buscar cartões" aria-label="Buscar cartões"><select id="tag-filter" aria-label="Filtrar por etiqueta"><option value="">Todas as etiquetas</option></select><select id="card-density" aria-label="Tamanho dos cartões" aria-controls="board"><option value="compact">Compacto</option><option value="regular">Padrão</option><option value="spacious">Amplo</option></select><button id="archive-view" type="button" aria-pressed="false">Arquivo</button></div></div>
  <div id="board" class="board" data-density="compact" aria-label="Listas do quadro"></div>
  <nav id="list-nav" aria-label="Navegar entre listas"></nav>
  <p id="notice" role="status"></p>
</main>
</div>
<dialog id="editor" aria-labelledby="editor-title"><header class="card-header"><div class="modal-head"><h2 id="editor-title">Novo cartão</h2><button type="button" id="close" aria-label="Fechar">×</button></div>
<p id="editor-context"></p><nav class="card-tabs" aria-label="Seções do cartão"><button type="button" id="details-tab" aria-pressed="true">Detalhes</button><button type="button" id="diary-tab" aria-pressed="false">Comentários</button></nav></header>
<form id="form"><label>Título<input name="title" required maxlength="100"></label>
<label>Descrição<textarea name="description" rows="3" maxlength="1000"></textarea></label>
<div class="row"><label>Data de início<input type="date" name="start"></label><label>Data de entrega<input type="date" name="date"></label></div><label>Mover para a lista<select name="column"></select></label>
<section class="label-section"><div><h3>Etiquetas</h3><div id="selected-labels" class="meta"></div></div><button type="button" id="manage-labels">Gerenciar etiquetas</button></section>
<label>Prioridade<select name="priority"><option>Normal</option><option>Alta</option></select></label>
<label>Responsável<input name="assignee" maxlength="80" placeholder="Nome da pessoa"></label>
<fieldset><legend>Checklist</legend><div id="checklist"></div><div class="row checklist-add"><input id="check-item" aria-label="Novo item do checklist" maxlength="120" placeholder="Novo item"><button type="button" id="add-item">Adicionar</button></div></fieldset>
<div class="actions"><button type="button" id="remove">Arquivar</button><button type="button" id="delete-card" class="danger" hidden>Excluir cartão</button><div><button type="button" id="cancel">Cancelar</button> <button class="primary" type="submit">Salvar cartão</button></div></div>
</form>
<section id="diary-panel" hidden aria-label="Comentários e criação do cartão"><div id="comments"></div><form id="comment-form" class="composer"><textarea id="comment" aria-label="Novo comentário" maxlength="500" rows="2" placeholder="Escreva um comentário…" required></textarea><button class="primary" type="submit">Publicar</button></form><p id="diary-status" role="status"></p></section>
</dialog>
<dialog id="label-dialog" aria-labelledby="label-title"><div class="modal-head"><h2 id="label-title">Etiquetas do quadro</h2><button type="button" id="close-labels" aria-label="Fechar etiquetas">×</button></div>
<label class="label-setting"><input type="checkbox" id="show-label-names"> Mostrar nomes no quadro</label>
<label class="label-setting"><input type="checkbox" id="label-patterns"> Diferenciar por padrões de cor</label>
<div id="label-options"></div>
<button type="button" id="new-label">＋ Criar etiqueta</button>
<form id="label-form" hidden><h3 id="label-form-title"></h3><label>Nome<input name="name" required maxlength="48"></label><fieldset><legend>Cor</legend><div class="color-options" id="label-colors"></div></fieldset><p id="label-error" role="status"></p><div class="actions"><button type="button" id="cancel-label">Cancelar</button><button type="submit" class="primary">Salvar etiqueta</button></div></form>
</dialog>
<dialog id="name-dialog"><form id="name-form"><h2 id="name-title"></h2><label>Nome<input name="name" required maxlength="80"></label><label id="done-field"><span><input type="checkbox" name="done"> Lista de conclusão</span></label><div class="actions"><button type="button" id="list-left">Mover à esquerda</button><button type="button" id="list-right">Mover à direita</button><button type="button" id="delete-list" class="danger" hidden>Excluir lista</button><div><button type="button" id="close-name">Cancelar</button> <button type="submit" class="primary">Salvar</button></div></div></form></dialog>
<dialog id="delete-list-dialog" aria-labelledby="delete-list-title">
  <form id="delete-list-form">
    <h2 id="delete-list-title">Excluir lista</h2>
    <p id="delete-list-description"></p>
    <label id="destination-field">Mover cartões para<select name="destination"></select></label>
    <div class="actions"><button type="button" id="cancel-delete-list">Cancelar</button><button type="submit" class="danger">Confirmar exclusão</button></div>
  </form>
</dialog>
</body></html>
